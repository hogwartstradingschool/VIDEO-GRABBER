<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:transparent;font-family:Manrope,"Segoe UI",system-ui,sans-serif;color:#fff}
body{display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.sc{position:fixed;inset:0;background:rgba(5,4,20,.5)}
.card{position:relative;max-height:90vh;overflow-y:auto;margin:0 8px 16px;padding:10px;border-radius:44px;scrollbar-width:none;
background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 45%),rgba(26,18,64,.9);border:2px solid rgba(255,255,255,.38);
box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 20px 50px rgba(0,0,0,.55)}.card::-webkit-scrollbar{display:none}
.hd{display:flex;align-items:center;gap:10px;padding:4px 8px 8px}.hd svg{width:40px;height:40px;animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(-5deg)}}
h1{flex:1;margin:0;font-size:20px;font-weight:800;background:linear-gradient(135deg,#ff4d8d,#a58bff);-webkit-background-clip:text;color:transparent}
.x{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);color:#fff;font-size:18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
#title{font-weight:800;font-size:14px;margin:0 10px 8px;line-height:1.35}#status{color:#d2d4f4;font-weight:700;font-size:12px;margin:0 10px 8px;word-break:break-all}
#msg{color:#ff8fa8;font-weight:800;font-size:13px;margin:6px 10px;white-space:pre-wrap}
h2{font-size:15px;margin:16px 10px 8px;font-weight:800}
.t{border:2px solid rgba(255,255,255,.9);color:#fff;font:800 13px Manrope,sans-serif;border-radius:999px;padding:9px 18px;margin:4px 10px;background:linear-gradient(135deg,#ff5c98,#8a64ff);box-shadow:inset 0 -4px 6px rgba(80,20,140,.3),0 8px 18px rgba(255,77,141,.45)}
</style></head><body>
<script src="bridge.js"></script><script src="panel.js"></script>
<div class="sc" id="sc"></div>
<div class="card"><div class="hd"><div id="pup"></div><h1>Video Grabber</h1><button class="x" id="cl">✕</button></div>
<div id="title"></div><div id="status"></div><vg-panel id="pn"></vg-panel><div id="msg"></div>
<button class="t" id="clip" style="display:none">📋 Clipboard se link lo</button>
<h2>Downloads</h2><vg-jobs id="dl"></vg-jobs></div>
<script>
const $=id=>document.getElementById(id),pn=$('pn'),dl=$('dl');let url='',data=null;
const api=(p,b)=>fetch('/api/'+p,{method:'POST',body:JSON.stringify(b||{})}).then(async r=>{const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j=t}if(!r.ok)throw new Error((j&&j.error)||t);return j});
$('pup').innerHTML='<img src="logo.png" style="width:42px;height:42px;display:block">';pn.setAttribute('theme','dark');dl.setAttribute('theme','dark');
const close=()=>api('close');$('sc').onclick=close;$('cl').onclick=close;
async function check(clip){$('msg').textContent='';$('title').textContent='';pn.data=null;$('clip').style.display='none';$('status').textContent='🔎 Sniffing out the qualities…';
 try{const d=await api('detect',{clip:!!clip});if(!d.url){$('status').textContent='';$('msg').textContent='Link nahi mila. Browser mein video page kholo, ya app mein Share → Copy link karo.';$('clip').style.display='inline-block';return}
  url=d.url;$('status').textContent=url;data=await api('formats',{url});$('title').textContent=data.title;$('status').textContent='';pn.data=data}
 catch(e){$('status').textContent='';$('msg').textContent='Oops: '+e.message;$('clip').style.display='inline-block'}}
$('clip').onclick=()=>check(true);
pn.addEventListener('vg-download',async e=>{const t=e.detail;try{await api('download',{url,height:t.height,size:t.size,title:data.title})}catch(x){$('msg').textContent='Oops: '+x.message}});
const act=async(a,id)=>{try{await api(a,{id})}catch(e){$('msg').textContent='Oops: '+e.message}};
pn.addEventListener('vg-job',e=>act(e.detail.act,e.detail.id));dl.addEventListener('vg-job',e=>act(e.detail.act,e.detail.id));
setInterval(async()=>{try{const L=await api('jobs');dl.data=L;const m={};L.filter(j=>j.url===url).forEach(j=>{if(!m[j.height]||m[j.height].id<j.id)m[j.height]=j});pn.jobs=m}catch(e){}},800);
setTimeout(()=>check(false),350);
</script></body></html>
